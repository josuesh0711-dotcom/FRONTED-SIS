<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/estilos.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

   <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📦 Inventario</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="registrar.html">Registrar Producto</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Consultar Productos</a></li>
                </ul>
            </div>
        </div>
    </nav> 

    <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <!-- CONTENEDOR PARA ALERTAS DINÁMICAS JS -->
            <div id="mensaje"></div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <h2 class="h4 text-primary border-bottom pb-2 mb-4">Registrar nuevo producto</h2>
                    
                    <form id="formProducto" action="#" method="POST">
                        <div class="mb-3">
                            <label for="codigo" class="form-label fw-bold">Código del Producto</label>
                            <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ejemplo: P001" required>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ejemplo: Teclado Mecánico" required>
                        </div>

                        <!-- Actividad 6: Campo Marca agregado en el formulario -->
                        <div class="mb-3">
                            <label for="marca" class="form-label fw-bold">Marca</label>
                            <input type="text" class="form-control" id="marca" name="marca" placeholder="Ejemplo: Logitech" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoría</label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                <option value="">Seleccione una opción</option>
                                <option value="Tecnología">Tecnología</option>
                                <option value="Papelería">Papelería</option>
                                <option value="Accesorios">Accesorios</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label fw-bold">Precio ($)</label>
                            <input type="number" class="form-control" id="precio" name="precio" placeholder="Ejemplo: 120000" step="any" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="cantidad" class="form-label fw-bold">Cantidad / Stock</label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="Ejemplo: 10" min="0" required>
                        </div>

                        <div class="mb-4">
                            <label for="proveedor" class="form-label fw-bold">Proveedor</label>
                            <input type="text" class="form-control" id="proveedor" name="proveedor" placeholder="Ejemplo: Logitech SAS" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill fw-bold">Guardar producto</button>
                            <button type="reset" class="btn btn-secondary flex-fill fw-bold">Limpiar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- TABLA PARA VER PRODUCTOS EN TIEMPO REAL -->
            <div class="card shadow-sm border-0 p-3">
                <h3 class="h5 text-primary mb-3">Productos Agregados</h3>
                <div class="table-responsive">
                    <table class="table table-striped align-middle m-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Marca</th>
                                <th>Precio</th>
                                <th>Stock</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">
                            <!-- Aquí JS insertará automáticamente las filas -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</main>

<footer class="bg-white text-center text-muted py-3 mt-auto border-top shadow-sm">
    <div class="container">
        <p class="mb-1"><strong>Aprendiz:</strong> Juan Josué Suarez Higuera</p>

    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
